<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موقف سمارت | دخول</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Inter", sans-serif;
      }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #0a0f1e 0%, #0a0f1e 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        flex-direction: column;
      }
      .login-container {
        max-width: 480px;
        width: 100%;
        background: rgba(18, 25, 45, 0.9);
        backdrop-filter: blur(12px);
        border-radius: 32px;
        padding: 40px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3);
      }
      .logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo h1 {
        font-size: 28px;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo p {
        color: #94a3b8;
        font-size: 14px;
        margin-top: 8px;
      }
      .input-group {
        margin-bottom: 24px;
      }
      .input-group label {
        display: block;
        color: #cbd5e1;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: 500;
      }
      .input-group input {
        width: 100%;
        padding: 14px 18px;
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 16px;
        color: #f1f5f9;
        font-size: 16px;
        transition: all 0.2s;
      }
      .input-group input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
      }
      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #3b82f6, #06b6d4);
        border: none;
        border-radius: 16px;
        color: white;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
      }
      .status {
        margin-top: 20px;
        padding: 12px;
        border-radius: 12px;
        text-align: center;
        font-size: 14px;
      }
      .status.error {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
      }
      .status.success {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
      }
      .signup-link {
        margin-top: 20px;
        text-align: center;
      }
      .signup-link a {
        color: #3b82f6;
        text-decoration: none;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <h1>🚗 Smart Parking Pro</h1>
        <p>نظام مواقف ذكي متكامل</p>
      </div>
      <div class="input-group">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          placeholder="admin@parking.com"
          autocomplete="email" />
      </div>
      <div class="input-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <button class="btn" id="loginBtn">تسجيل الدخول</button>
      <div id="status" class="status"></div>
      <div class="signup-link">
        <a href="./signup/signup.html">➕ ليس لديك حساب؟ سجل الآن</a>
      </div>
    </div>
    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        set,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
      import {
        getAuth,
        setPersistence,
        browserLocalPersistence,
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBHFT1kSAa0kwxfQQWK4ZSMcv-N0PdqIr8",
        authDomain: "iot-smart-parking-49293.firebaseapp.com",
        databaseURL:
          "https://iot-smart-parking-49293-default-rtdb.firebaseio.com",
        projectId: "iot-smart-parking-49293",
        storageBucket: "iot-smart-parking-49293.appspot.com",
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const auth = getAuth(app);
      await setPersistence(auth, browserLocalPersistence);

      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const statusDiv = document.getElementById("status");

      const showStatus = (msg, isError = false) => {
        statusDiv.textContent = msg;
        statusDiv.className = `status ${isError ? "error" : "success"}`;
        setTimeout(() => {
          if (statusDiv.textContent === msg) statusDiv.textContent = "";
        }, 3000);
      };

      const resolveRole = async (user) => {
        const roleSnap = await get(ref(db, `users/${user.uid}/role`));
        if (roleSnap.exists()) return roleSnap.val();
        await set(ref(db, `users/${user.uid}`), {
          email: user.email,
          role: "user",
          createdAt: Date.now(),
          active: true,
          wallet: 0,
        });
        return "user";
      };

      const routeByRole = (role) => {
        if (role === "admin") window.location.href = "./admin/index.html";
        else window.location.href = "./user/index.html";
      };

      loginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();
        if (!email || !pass)
          return showStatus("⚠️ الرجاء إدخال البريد وكلمة المرور", true);
        loginBtn.disabled = true;
        loginBtn.textContent = "جاري التحقق...";
        try {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          const role = await resolveRole(cred.user);
          showStatus("✅ تم بنجاح، جاري التحويل...");
          setTimeout(() => routeByRole(role), 500);
        } catch (e) {
          showStatus(e.message, true);
          loginBtn.disabled = false;
          loginBtn.textContent = "تسجيل الدخول";
        }
      };

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const role = await resolveRole(user);
          routeByRole(role);
        }
      });
    </script>
  </body>
</html>
