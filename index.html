<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>موقف سمارت | دخول</title>
    <script src="./no-reload.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #111827;
        --surface: rgba(30, 41, 59, 0.75);
        --surface-hover: rgba(35, 48, 68, 0.8);
        --border: rgba(59, 130, 246, 0.08);
        --border-hover: rgba(59, 130, 246, 0.15);
        --accent: #3b82f6;
        --accent-dark: #2563eb;
        --accent-glow: rgba(59, 130, 246, 0.12);
        --green: #10b981;
        --red: #ef4444;
        --text: #f1f5f9;
        --text-soft: #94a3b8;
        --text-muted: #64748b;
        --radius: 20px;
        --radius-sm: 14px;
        --font: "Cairo", sans-serif;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        background-image: radial-gradient(
          ellipse at 20% 50%,
          rgba(59, 130, 246, 0.03) 0%,
          transparent 50%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: var(--font);
      }

      .card {
        width: 100%;
        max-width: 400px;
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: var(--radius);
        padding: 44px 36px 36px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .logo {
        text-align: center;
        margin-bottom: 36px;
      }
      .logo-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, var(--accent), #8b5cf6);
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 14px;
        box-shadow: 0 8px 24px var(--accent-glow);
      }
      .logo h1 {
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
      }
      .logo h1 span {
        color: var(--accent);
      }
      .logo p {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 2px;
      }

      .field {
        margin-bottom: 20px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-soft);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 13px 16px;
        background: rgba(0, 0, 0, 0.25);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 15px;
        font-family: var(--font);
        direction: rtl;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }
      .field input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      }
      .field input::placeholder {
        color: var(--text-muted);
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        border: none;
        border-radius: var(--radius-sm);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
        transition: box-shadow 0.2s;
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
      }
      .btn:hover:not(:disabled) {
        box-shadow: 0 8px 28px rgba(59, 130, 246, 0.3);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.loading {
        color: transparent;
        pointer-events: none;
        position: relative;
      }
      .btn.loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2.5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        top: 50%;
        left: 50%;
        margin: -10px 0 0 -10px;
      }

      .status {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        display: none;
      }
      .status.error {
        display: block;
        background: rgba(239, 68, 68, 0.06);
        border: 1px solid rgba(239, 68, 68, 0.1);
        color: var(--red);
      }
      .status.success {
        display: block;
        background: rgba(16, 185, 129, 0.06);
        border: 1px solid rgba(16, 185, 129, 0.1);
        color: var(--green);
      }

      .footer-links {
        margin-top: 24px;
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .footer-links a {
        color: var(--accent);
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .footer-links a:hover {
        color: #60a5fa;
      }

      @media (max-width: 480px) {
        .card {
          padding: 32px 24px 28px;
        }
        .logo-icon {
          width: 52px;
          height: 52px;
          font-size: 24px;
        }
        .logo h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🅿️</div>
        <h1>موقف <span>سمارت</span></h1>
        <p>نظام مواقف ذكي متكامل</p>
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          placeholder="admin@parking.com"
          autocomplete="email" />
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>

      <button class="btn" id="loginBtn">تسجيل الدخول</button>
      <div id="status" class="status"></div>

      <div class="footer-links">
        <a href="./signup/signup.html">➕ إنشاء حساب جديد</a>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
      import {
        getDatabase,
        ref,
        get,
        set,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-database.js";
      import {
        getAuth,
        setPersistence,
        browserLocalPersistence,
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

      const firebaseConfig = {
        apiKey: "AIzaSyBHFT1kSAa0kwxfQQWK4ZSMcv-N0PdqIr8",
        authDomain: "iot-smart-parking-49293.firebaseapp.com",
        databaseURL:
          "https://iot-smart-parking-49293-default-rtdb.firebaseio.com",
        projectId: "iot-smart-parking-49293",
        storageBucket: "iot-smart-parking-49293.appspot.com",
      };
      const app = initializeApp(firebaseConfig);
      const db = getDatabase(app);
      const auth = getAuth(app);
      await setPersistence(auth, browserLocalPersistence);

      const emailInput = document.getElementById("email");
      const passInput = document.getElementById("password");
      const loginBtn = document.getElementById("loginBtn");
      const statusDiv = document.getElementById("status");

      const showStatus = (msg, isError = false) => {
        statusDiv.textContent = msg;
        statusDiv.className = `status ${isError ? "error" : "success"}`;
        setTimeout(() => {
          if (statusDiv.textContent === msg) {
            statusDiv.textContent = "";
            statusDiv.className = "status";
          }
        }, 3500);
      };

      const resolveRole = async (user) => {
        const roleSnap = await get(ref(db, `users/${user.uid}/role`));
        if (roleSnap.exists()) return roleSnap.val();
        await set(ref(db, `users/${user.uid}`), {
          email: user.email,
          role: "user",
          createdAt: Date.now(),
          active: true,
          wallet: 0,
        });
        return "user";
      };

      const routeByRole = (role) => {
        window.location.href =
          role === "admin" ? "./admin/index.html" : "./user/index.html";
      };

      loginBtn.onclick = async () => {
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();
        if (!email || !pass)
          return showStatus("⚠️ الرجاء إدخال البريد وكلمة المرور", true);
        loginBtn.disabled = true;
        loginBtn.classList.add("loading");
        try {
          const cred = await signInWithEmailAndPassword(auth, email, pass);
          const role = await resolveRole(cred.user);
          showStatus("✅ تم بنجاح، جاري التحويل...");
          loginBtn.classList.remove("loading");
          setTimeout(() => routeByRole(role), 600);
        } catch (e) {
          showStatus(e.message, true);
          loginBtn.disabled = false;
          loginBtn.classList.remove("loading");
        }
      };

      onAuthStateChanged(auth, async (user) => {
        if (user) {
          const role = await resolveRole(user);
          routeByRole(role);
        }
      });
    </script>
  </body>
</html>
