<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>إنشاء حساب | موقف سمارت</title>
    <script src="../no-reload.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: #111827;
        --surface: rgba(30, 41, 59, 0.75);
        --border: rgba(59, 130, 246, 0.08);
        --border-hover: rgba(59, 130, 246, 0.15);
        --accent: #3b82f6;
        --accent-dark: #2563eb;
        --accent-glow: rgba(59, 130, 246, 0.12);
        --purple: #8b5cf6;
        --green: #10b981;
        --red: #ef4444;
        --text: #f1f5f9;
        --text-soft: #94a3b8;
        --text-muted: #64748b;
        --radius: 20px;
        --radius-sm: 14px;
        --font: "Cairo", sans-serif;
      }

      body {
        min-height: 100vh;
        background: var(--bg);
        background-image: radial-gradient(
          ellipse at 80% 20%,
          rgba(139, 92, 246, 0.03) 0%,
          transparent 50%
        );
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-family: var(--font);
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: var(--surface);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border-radius: var(--radius);
        padding: 40px 36px 36px;
        border: 1px solid var(--border);
        box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4);
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(12px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .logo {
        text-align: center;
        margin-bottom: 32px;
      }
      .logo-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #8b5cf6, var(--accent));
        border-radius: 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        margin-bottom: 14px;
        box-shadow: 0 8px 24px rgba(139, 92, 246, 0.15);
      }
      .logo h1 {
        font-size: 24px;
        font-weight: 800;
        color: var(--text);
      }
      .logo h1 span {
        background: linear-gradient(135deg, #8b5cf6, var(--accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .logo p {
        color: var(--text-muted);
        font-size: 13px;
        margin-top: 2px;
      }

      .field {
        margin-bottom: 18px;
      }
      .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: var(--text-soft);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        padding: 13px 16px;
        background: rgba(0, 0, 0, 0.25);
        border: 1.5px solid var(--border);
        border-radius: var(--radius-sm);
        color: var(--text);
        font-size: 15px;
        font-family: var(--font);
        direction: rtl;
        transition:
          border 0.2s,
          box-shadow 0.2s;
      }
      .field input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.08);
      }
      .field input::placeholder {
        color: var(--text-muted);
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #8b5cf6, var(--accent));
        border: none;
        border-radius: var(--radius-sm);
        color: #fff;
        font-size: 15px;
        font-weight: 700;
        font-family: var(--font);
        cursor: pointer;
        transition: box-shadow 0.2s;
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.2);
      }
      .btn:hover:not(:disabled) {
        box-shadow: 0 8px 28px rgba(59, 130, 246, 0.3);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .btn.loading {
        color: transparent;
        pointer-events: none;
        position: relative;
      }
      .btn.loading::after {
        content: "";
        position: absolute;
        width: 20px;
        height: 20px;
        border: 2.5px solid rgba(255, 255, 255, 0.2);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        top: 50%;
        left: 50%;
        margin: -10px 0 0 -10px;
      }

      .status {
        margin-top: 16px;
        padding: 12px 16px;
        border-radius: var(--radius-sm);
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        display: none;
      }
      .status.error {
        display: block;
        background: rgba(239, 68, 68, 0.06);
        border: 1px solid rgba(239, 68, 68, 0.1);
        color: var(--red);
      }
      .status.success {
        display: block;
        background: rgba(16, 185, 129, 0.06);
        border: 1px solid rgba(16, 185, 129, 0.1);
        color: var(--green);
      }

      .footer-links {
        margin-top: 24px;
        text-align: center;
        padding-top: 20px;
        border-top: 1px solid var(--border);
      }
      .footer-links a {
        color: #8b5cf6;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }
      .footer-links a:hover {
        color: #a78bfa;
      }

      @media (max-width: 480px) {
        .card {
          padding: 28px 20px 24px;
        }
        .logo-icon {
          width: 52px;
          height: 52px;
          font-size: 24px;
        }
        .logo h1 {
          font-size: 22px;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🔑</div>
        <h1>إنشاء <span>حساب</span></h1>
        <p>انضم إلى نظام مواقف سمارت</p>
      </div>

      <div class="field">
        <label>البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          placeholder="example@domain.com"
          autocomplete="email" />
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>تأكيد كلمة المرور</label>
        <input type="password" id="confirmPassword" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>الاسم (اختياري)</label>
        <input type="text" id="displayName" placeholder="اسمك الكامل" />
      </div>

      <button class="btn" id="signupBtn">إنشاء حساب</button>
      <div id="status" class="status"></div>

      <div class="footer-links">
        <a href="../index.html">🔐 لديك حساب بالفعل؟ سجل دخول</a>
      </div>
    </div>

    <script type="module" src="./signup.js"></script>
  </body>
</html>
