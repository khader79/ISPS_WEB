<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>⚡ Embedded Labs Pro | Ultimate Simulator + IDE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
      }
      :root {
        --bg: #0a0c14;
        --surface: #0f1422;
        --surface2: #131a2c;
        --border: #1f2b44;
        --accent: #00e0ff;
        --accent2: #8b5cf6;
        --accent3: #10b981;
        --danger: #ef4444;
        --text: #eef2ff;
        --muted: #6b7280;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font-family: "Inter", sans-serif;
        overflow: hidden;
        height: 100vh;
      }
      .app {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      /* Header */
      .top-bar {
        background: rgba(15, 20, 34, 0.95);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 6px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 12px;
      }
      .logo h2 {
        font-size: 1.2rem;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .toolbar {
        display: flex;
        gap: 8px;
      }
      .btn {
        background: var(--surface2);
        border: 1px solid var(--border);
        padding: 5px 12px;
        border-radius: 30px;
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover {
        background: rgba(0, 224, 255, 0.1);
        border-color: var(--accent);
      }
      .btn-primary {
        background: var(--accent);
        color: #000;
        border-color: var(--accent);
      }
      /* Main layout */
      .main-grid {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      /* Components panel */
      .components-panel {
        width: 280px;
        background: var(--surface);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .panel-header {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 700;
        font-size: 12px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .comp-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px;
      }
      .comp-cat {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        padding: 8px 6px 2px;
        letter-spacing: 1px;
      }
      .comp-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 10px;
        margin-bottom: 4px;
        border-radius: 10px;
        cursor: grab;
        background: var(--surface2);
        border: 1px solid transparent;
        transition: 0.1s;
      }
      .comp-item:hover {
        background: #1a2338;
        border-color: var(--accent);
      }
      .comp-icon {
        font-size: 22px;
        width: 36px;
        text-align: center;
      }
      .comp-name {
        font-weight: 600;
        font-size: 12px;
      }
      .comp-desc {
        font-size: 9px;
        color: var(--muted);
      }
      /* Canvas area */
      .canvas-area {
        flex: 1;
        position: relative;
        background: #050810;
        overflow: hidden;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        cursor: crosshair;
      }
      .canvas-tools {
        position: absolute;
        top: 12px;
        right: 12px;
        display: flex;
        gap: 6px;
        z-index: 10;
      }
      /* Properties panel */
      .props-panel {
        width: 300px;
        background: var(--surface);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .props-content {
        flex: 1;
        overflow-y: auto;
        padding: 16px;
      }
      .prop-group {
        margin-bottom: 20px;
      }
      .prop-label {
        font-size: 11px;
        color: var(--muted);
        margin-bottom: 4px;
        display: block;
      }
      .prop-value {
        background: var(--surface2);
        border-radius: 10px;
        padding: 6px 10px;
        font-family: monospace;
        font-size: 12px;
        border: 1px solid var(--border);
        width: 100%;
        color: var(--text);
      }
      /* IDE footer */
      .ide-container {
        height: 300px;
        background: var(--surface);
        border-top: 1px solid var(--border);
        display: flex;
        flex-direction: column;
      }
      .ide-tabs {
        display: flex;
        background: var(--surface2);
        border-bottom: 1px solid var(--border);
      }
      .ide-tab {
        padding: 6px 20px;
        cursor: pointer;
        font-size: 12px;
        font-weight: 600;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .ide-tab.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
      }
      .ide-pane {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .editor-area {
        display: flex;
        flex: 1;
        overflow: hidden;
      }
      .line-numbers {
        width: 45px;
        background: #0d1117;
        padding: 8px 4px;
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        text-align: right;
        color: var(--muted);
        border-left: 1px solid var(--border);
        overflow: hidden;
      }
      #codeEditor {
        flex: 1;
        background: #0a0c14;
        border: none;
        color: var(--text);
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        resize: none;
        outline: none;
        padding: 8px;
        line-height: 1.4;
      }
      .serial-pane {
        display: none;
        flex-direction: column;
        background: #05070e;
        height: 100%;
      }
      .serial-output {
        flex: 1;
        overflow-y: auto;
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        padding: 8px;
        color: var(--accent3);
        direction: ltr;
        white-space: pre-wrap;
      }
      .serial-input-row {
        display: flex;
        border-top: 1px solid var(--border);
      }
      .serial-input {
        flex: 1;
        background: none;
        border: none;
        padding: 8px;
        color: var(--text);
        font-family: monospace;
        outline: none;
      }
      .serial-send {
        background: var(--accent);
        border: none;
        padding: 0 16px;
        color: #000;
        font-weight: bold;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top-bar">
        <div class="logo"><h2>⚡ Embedded Labs Ultimate</h2></div>
        <div class="toolbar">
          <button class="btn" onclick="saveProject()">
            <i class="fas fa-save"></i> حفظ
          </button>
          <button class="btn" onclick="loadProject()">
            <i class="fas fa-folder-open"></i> فتح
          </button>
          <button class="btn" onclick="clearCanvas()">
            <i class="fas fa-trash"></i> مسح الكل
          </button>
          <button class="btn btn-primary" onclick="runSimulation()">
            <i class="fas fa-play"></i> محاكاة
          </button>
          <button class="btn" onclick="stopSimulation()">
            <i class="fas fa-stop"></i> إيقاف
          </button>
        </div>
      </div>
      <div class="main-grid">
        <div class="components-panel">
          <div class="panel-header">
            <i class="fas fa-microchip"></i> مكتبة القطع (30+)
          </div>
          <div class="comp-list" id="compList"></div>
        </div>
        <div class="canvas-area" id="canvasArea">
          <canvas id="circuitCanvas"></canvas>
          <div class="canvas-tools">
            <button class="btn" onclick="fitView()">📐 ملائمة</button>
            <button class="btn" onclick="deleteLastWire()">
              🗑️ حذف آخر سلك
            </button>
          </div>
        </div>
        <div class="props-panel" id="propsPanel">
          <div class="panel-header">
            <i class="fas fa-sliders-h"></i> الخصائص الحية
          </div>
          <div class="props-content" id="propsContent">
            <div style="color: var(--muted); text-align: center; padding: 20px">
              اختر قطعة لعرض خصائصها
            </div>
          </div>
        </div>
      </div>
      <div class="ide-container">
        <div class="ide-tabs">
          <div class="ide-tab active" data-tab="code">📝 Code Editor</div>
          <div class="ide-tab" data-tab="serial">📡 Serial Monitor</div>
        </div>
        <div class="ide-pane" id="codePane">
          <div class="editor-area">
            <div class="line-numbers" id="lineNumbers">1</div>
            <textarea id="codeEditor" spellcheck="false"></textarea>
          </div>
        </div>
        <div class="ide-pane" id="serialPane" style="display: none">
          <div class="serial-output" id="serialOutput"></div>
          <div class="serial-input-row">
            <input
              class="serial-input"
              id="serialInput"
              placeholder="أرسل أمراً..."
              onkeypress="if (event.key === 'Enter') sendSerialCmd();" />
            <button class="serial-send" onclick="sendSerialCmd()">إرسال</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // --------------------- تعريف جميع القطع (30+ نموذجية) ---------------------
      const COMPONENTS = [
        {

        },
        {

        },
        {
          id: "resistor",

        },
        {

        },
        {
          id: "pot",
          cat: "PASSIVE",

          icon: "🎚️",
          desc: "10kΩ",
          width: 50,
          height: 50,
          pins: ["1", "2", "3"],
          model: "pot",
          value: 10000,
        },
        {
          id: "led",

        },
        {

          width: 70,

          pins: ["PWM", "VCC", "GND"],

          angle: 0,
        },
        {
          id: "stepper",

          icon: "🔄",
          desc: "Unipolar",
          width: 80,
          height: 70,
          pins: ["IN1", "IN2", "IN3", "IN4", "VCC", "GND"],
          model: "stepper",
          steps: 0,
        },
        {
          id: "lcd_i2c",
          cat: "DISPLAY",
          name: "LCD 16x2 I2C",
          icon: "🖥️",
          desc: "I2C",
          width: 100,
          height: 70,
          pins: ["SDA", "SCL", "VCC", "GND"],
          model: "lcd",
          text: "Hello",
        },
        {
          id: "ultrasonic",
          cat: "SENSOR",
          name: "HC-SR04",
          icon: "📡",
          desc: "Ultrasonic",
          width: 90,
          height: 60,
          pins: ["VCC", "TRIG", "ECHO", "GND"],
          model: "ultrasonic",
          distance: 50,
        },
        {
          id: "ir_sensor",
          cat: "SENSOR",
          name: "IR Sensor",
          icon: "📡",
          desc: "Digital obstacle",
          width: 70,
          height: 50,
          pins: ["VCC", "GND", "OUT"],
          model: "ir",
          obstacle: false,
        },
        {
          id: "pir",
          cat: "SENSOR",
          name: "PIR Motion",
          icon: "👁️",
          desc: "Motion",
          width: 70,
          height: 50,
          pins: ["VCC", "OUT", "GND"],
          model: "pir",
          motion: false,
        },
        {
          id: "dht22",
          cat: "SENSOR",
          name: "DHT22",
          icon: "🌡️",
          desc: "Temp/Hum",
          width: 60,
          height: 60,
          pins: ["VCC", "DATA", "GND"],
          model: "dht",
          temp: 25,
          hum: 60,
        },
        {
          id: "ldr",
          cat: "SENSOR",
          name: "LDR",
          icon: "💡",
          desc: "Light",
          width: 40,
          height: 40,
          pins: ["A", "B"],
          model: "ldr",
          resistance: 5000,
        },
        {
          id: "buzzer",
          cat: "OUTPUT",
          name: "Buzzer",
          icon: "🔔",
          desc: "Active",
          width: 40,
          height: 40,
          pins: ["+", "-"],
          model: "buzzer",
          state: false,
        },
        {
          id: "relay",
          cat: "OUTPUT",
          name: "Relay 5V",
          icon: "⏚",
          desc: "SPDT",
          width: 60,
          height: 60,
          pins: ["IN", "COM", "NO", "NC", "VCC", "GND"],
          model: "relay",
          active: false,
        },
        {
          id: "button",
          cat: "INPUT",
          name: "Push Button",
          icon: "🔘",
          desc: "Momentary",
          width: 40,
          height: 40,
          pins: ["1", "2"],
          model: "button",
          pressed: false,
        },
        {
          id: "transistor_npn",
          cat: "ACTIVE",
          name: "NPN (BC547)",
          icon: "🔻",
          desc: "Switching",
          width: 50,
          height: 60,
          pins: ["C", "B", "E"],
          model: "npn",
          state: false,
        },
        {
          id: "mosfet",
          cat: "ACTIVE",
          name: "MOSFET IRF540",
          icon: "🔺",
          desc: "N-Channel",
          width: 60,
          height: 60,
          pins: ["D", "G", "S"],
          model: "mosfet",
          state: false,
        },
        {
          id: "motor_dc",
          cat: "OUTPUT",
          name: "DC Motor",
          icon: "⚡",
          desc: "Brushed",
          width: 60,
          height: 50,
          pins: ["M1", "M2"],
          model: "motor",
          speed: 0,
        },
      ];

      // حالة الدائرة
      let circuitComponents = []; // لا توجد قطع افتراضية
      let wires = [];
      let selectedCompId = null;
      let simulationInterval = null;
      let isSimulating = false;
      let canvas, ctx, canvasWidth, canvasHeight;
      let dragData = { dragging: false, compId: null, offsetX: 0, offsetY: 0 };
      let wireMode = {
        active: false,
        fromComp: null,
        fromPin: null,
        fromX: 0,
        fromY: 0,
      };

      function generateId() {
        return Date.now() + "-" + Math.random().toString(36).substr(2, 8);
      }

      // إضافة قطعة جديدة
      function addComponent(compDef, x, y) {
        const newComp = {
          id: generateId(),
          compDef: compDef,
          x: x || 150,
          y: y || 150,
          width: compDef.width,
          height: compDef.height,
          pins: compDef.pins.map((p) => ({ name: p, connected: false })),
          values: { ...compDef },
        };
        if (compDef.model === "led") newComp.values.state = false;
        if (compDef.model === "servo") newComp.values.angle = 0;
        if (compDef.model === "stepper") newComp.values.position = 0;
        if (compDef.model === "lcd") newComp.values.text = "Hello";
        if (compDef.model === "ultrasonic") newComp.values.distance = 50;
        if (compDef.model === "ir") newComp.values.obstacle = false;
        if (compDef.model === "pir") newComp.values.motion = false;
        if (compDef.model === "dht") {
          newComp.values.temp = 25;
          newComp.values.hum = 60;
        }
        if (compDef.model === "ldr") newComp.values.resistance = 5000;
        if (compDef.model === "buzzer") newComp.values.state = false;
        if (compDef.model === "relay") newComp.values.active = false;
        if (compDef.model === "button") newComp.values.pressed = false;
        if (compDef.model === "npn") newComp.values.state = false;
        if (compDef.model === "mosfet") newComp.values.state = false;
        if (compDef.model === "motor") newComp.values.speed = 0;
        circuitComponents.push(newComp);
        drawCanvas();
        updatePropsPanel(null);
      }

      // رسم الكانفاس
      function drawCanvas() {
        if (!ctx) return;
        ctx.clearRect(0, 0, canvasWidth, canvasHeight);
        // الأسلاك
        ctx.beginPath();
        ctx.strokeStyle = "#22c55e";
        ctx.lineWidth = 2;
        wires.forEach((w) => {
          const fromComp = circuitComponents.find((c) => c.id === w.fromCompId);
          const toComp = circuitComponents.find((c) => c.id === w.toCompId);
          if (fromComp && toComp) {
            const p1 = getPinPos(fromComp, w.fromPin);
            const p2 = getPinPos(toComp, w.toPin);
            if (p1 && p2) {
              ctx.beginPath();
              ctx.moveTo(p1.x, p1.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.stroke();
            }
          }
        });
        // القطع
        circuitComponents.forEach((comp) => {
          const { x, y, width, height, compDef, values, id } = comp;
          const isSelected = selectedCompId === id;
          ctx.fillStyle = isSelected ? "#1e3a5f" : "#0f172a";
          ctx.strokeStyle = isSelected ? "#00e0ff" : "#2d3a5e";
          ctx.lineWidth = isSelected ? 2.5 : 1.5;
          ctx.fillRect(x, y, width, height);
          ctx.strokeRect(x, y, width, height);
          ctx.font = "22px serif";
          ctx.fillStyle = "#e2e8f0";
          ctx.fillText(compDef.icon, x + 8, y + 32);
          ctx.font = "bold 10px Inter";
          ctx.fillStyle = "#a0b0d0";
          ctx.fillText(compDef.name, x + 45, y + 20);
          comp.pins.forEach((pin, idx) => {
            const pos = getPinPos(comp, pin.name);
            if (pos) {
              ctx.fillStyle = "#f59e0b";
              ctx.beginPath();
              ctx.arc(pos.x, pos.y, 5, 0, 2 * Math.PI);
              ctx.fill();
              ctx.fillStyle = "#ccc";
              ctx.font = "8px monospace";
              ctx.fillText(pin.name, pos.x - 12, pos.y - 2);
            }
          });
          if (compDef.model === "led" && values.state) {
            ctx.fillStyle = "#ff6666";
            ctx.beginPath();
            ctx.arc(x + width - 12, y + 12, 6, 0, 2 * Math.PI);
            ctx.fill();
          }
          if (compDef.model === "servo") {
            ctx.fillStyle = "#4ade80";
            ctx.font = "bold 10px monospace";
            ctx.fillText(values.angle + "°", x + width - 25, y + 15);
          }
          if (compDef.model === "lcd") {
            ctx.fillStyle = "#fff";
            ctx.font = "8px monospace";
            ctx.fillText(values.text.slice(0, 14), x + 8, y + height - 8);
          }
          if (compDef.model === "ultrasonic") {
            ctx.fillStyle = "#facc15";
            ctx.font = "8px monospace";
            ctx.fillText(values.distance + "cm", x + 8, y + height - 4);
          }
        });
        // سلك مؤقت
        if (wireMode.active && wireMode.fromComp) {
          ctx.beginPath();
          ctx.setLineDash([5, 5]);
          ctx.strokeStyle = "#00e0ff";
          ctx.lineWidth = 2;
          ctx.moveTo(wireMode.fromX, wireMode.fromY);
          ctx.lineTo(wireMode.toX, wireMode.toY);
          ctx.stroke();
          ctx.setLineDash([]);
        }
      }

      function getPinPos(comp, pinName) {
        const idx = comp.pins.findIndex((p) => p.name === pinName);
        if (idx === -1) return null;
        const pinX = comp.x + (idx + 1) * (comp.width / (comp.pins.length + 1));
        const pinY = comp.y + comp.height - 6;
        return { x: pinX, y: pinY };
      }

      // أحداث الماوس
      function initCanvasEvents() {
        canvas.addEventListener("mousedown", (e) => {
          const rect = canvas.getBoundingClientRect();
          const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
          const my = (e.clientY - rect.top) * (canvas.height / rect.height);
          // Pin hit?
          let hitPin = null;
          for (let comp of circuitComponents) {
            for (let pin of comp.pins) {
              const pos = getPinPos(comp, pin.name);
              if (pos && Math.hypot(mx - pos.x, my - pos.y) < 8) {
                hitPin = { comp, pin: pin.name, x: pos.x, y: pos.y };
                break;
              }
            }
            if (hitPin) break;
          }
          if (hitPin) {
            wireMode.active = true;
            wireMode.fromComp = hitPin.comp;
            wireMode.fromPin = hitPin.pin;
            wireMode.fromX = hitPin.x;
            wireMode.fromY = hitPin.y;
            wireMode.toX = mx;
            wireMode.toY = my;
            drawCanvas();
            return;
          }
          // component drag
          for (let i = circuitComponents.length - 1; i >= 0; i--) {
            const c = circuitComponents[i];
            if (
              mx >= c.x &&
              mx <= c.x + c.width &&
              my >= c.y &&
              my <= c.y + c.height
            ) {
              selectedCompId = c.id;
              dragData.dragging = true;
              dragData.compId = c.id;
              dragData.offsetX = mx - c.x;
              dragData.offsetY = my - c.y;
              updatePropsPanel(c);
              drawCanvas();
              return;
            }
          }
          selectedCompId = null;
          updatePropsPanel(null);
          drawCanvas();
        });

        canvas.addEventListener("mousemove", (e) => {
          if (dragData.dragging) {
            const rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            let my = (e.clientY - rect.top) * (canvas.height / rect.height);
            const comp = circuitComponents.find(
              (c) => c.id === dragData.compId,
            );
            if (comp) {
              comp.x = Math.min(
                Math.max(mx - dragData.offsetX, 0),
                canvas.width - comp.width,
              );
              comp.y = Math.min(
                Math.max(my - dragData.offsetY, 0),
                canvas.height - comp.height,
              );
              drawCanvas();
            }
          }
          if (wireMode.active) {
            const rect = canvas.getBoundingClientRect();
            wireMode.toX =
              (e.clientX - rect.left) * (canvas.width / rect.width);
            wireMode.toY =
              (e.clientY - rect.top) * (canvas.height / rect.height);
            drawCanvas();
          }
        });

        canvas.addEventListener("mouseup", (e) => {
          if (dragData.dragging) {
            dragData.dragging = false;
            drawCanvas();
          }
          if (wireMode.active) {
            const rect = canvas.getBoundingClientRect();
            const mx = (e.clientX - rect.left) * (canvas.width / rect.width);
            const my = (e.clientY - rect.top) * (canvas.height / rect.height);
            let targetPin = null;
            for (let comp of circuitComponents) {
              for (let pin of comp.pins) {
                const pos = getPinPos(comp, pin.name);
                if (pos && Math.hypot(mx - pos.x, my - pos.y) < 8) {
                  targetPin = { comp, pin: pin.name };
                  break;
                }
              }
              if (targetPin) break;
            }
            if (
              targetPin &&
              wireMode.fromComp &&
              targetPin.comp.id !== wireMode.fromComp.id
            ) {
              wires.push({
                fromCompId: wireMode.fromComp.id,
                fromPin: wireMode.fromPin,
                toCompId: targetPin.comp.id,
                toPin: targetPin.pin,
              });
            }
            wireMode.active = false;
            drawCanvas();
          }
        });
      }

      // خصائص القطعة
      function updatePropsPanel(comp) {
        const container = document.getElementById("propsContent");
        if (!comp) {
          container.innerHTML =
            '<div style="color:var(--muted); text-align:center; padding:20px;">اختر قطعة لعرض خصائصها</div>';
          return;
        }
        let html = `<div class="prop-group"><span class="prop-label">القطعة</span><div class="prop-value">${comp.compDef.name}</div></div>`;
        if (comp.compDef.model === "resistor") {
          html += `<div class="prop-group"><span class="prop-label">المقاومة (Ω)</span><input class="prop-value" type="number" value="${comp.values.value}" onchange="updateCompValue('${comp.id}','value', this.value)"></div>`;
          html += `<div class="prop-group"><span class="prop-label">التيار (mA)</span><div class="prop-value" id="current_${comp.id}">--</div></div>`;
        }
        if (comp.compDef.model === "voltage") {
          html += `<div class="prop-group"><span class="prop-label">الجهد (V)</span><input class="prop-value" type="number" step="0.1" value="${comp.values.value}" onchange="updateCompValue('${comp.id}','value', this.value)"></div>`;
        }
        if (comp.compDef.model === "led") {
          html += `<button class="btn" style="width:100%;" onclick="toggleLED('${comp.id}')">تبديل LED</button>`;
        }
        if (comp.compDef.model === "servo") {
          html += `<div class="prop-group"><span class="prop-label">الزاوية (0-180)</span><input class="prop-value" type="range" min="0" max="180" value="${comp.values.angle}" onchange="updateCompValue('${comp.id}','angle', this.value)"></div>`;
        }
        if (comp.compDef.model === "lcd") {
          html += `<div class="prop-group"><span class="prop-label">النص</span><input class="prop-value" type="text" value="${comp.values.text}" onchange="updateCompValue('${comp.id}','text', this.value)"></div>`;
        }
        if (comp.compDef.model === "button") {
          html += `<button class="btn" style="width:100%;" onclick="toggleButton('${comp.id}')">اضغط الزر (محاكاة)</button>`;
        }
        container.innerHTML = html;
      }

      window.updateCompValue = function (id, key, val) {
        const comp = circuitComponents.find((c) => c.id === id);
        if (comp) {
          comp.values[key] =
            key === "value" || key === "angle" ? parseFloat(val) : val;
          drawCanvas();
        }
      };
      window.toggleLED = function (id) {
        const comp = circuitComponents.find((c) => c.id === id);
        if (comp) comp.values.state = !comp.values.state;
        drawCanvas();
      };
      window.toggleButton = function (id) {
        const comp = circuitComponents.find((c) => c.id === id);
        if (comp) comp.values.pressed = !comp.values.pressed;
        drawCanvas();
      };

      // تحليل كهربائي بسيط
      function analyzeCircuit() {
        circuitComponents.forEach((comp) => {
          if (comp.compDef.model === "resistor") {
            let voltage = 0;
            wires.forEach((w) => {
              if (w.toCompId === comp.id || w.fromCompId === comp.id) {
                const otherId =
                  w.toCompId === comp.id ? w.fromCompId : w.toCompId;
                const other = circuitComponents.find((c) => c.id === otherId);
                if (other && other.compDef.model === "voltage") {
                  voltage = other.values.value || 9;
                }
              }
            });
            const resistance = comp.values.value;
            const current = voltage / resistance;
            const currentMa = (current * 1000).toFixed(2);
            const span = document.getElementById(`current_${comp.id}`);
            if (span) span.innerText = currentMa + " mA";
          }
        });
      }

      // محاكاة الكود (دعم Unicode في Serial)
      let arduinoPins = new Array(50).fill(0);
      function parseAndRunCode() {
        const code = document.getElementById("codeEditor").value;
        // digitalWrite
        const digitalWrites = code.matchAll(
          /digitalWrite\((\d+),\s*(HIGH|LOW)\)/gi,
        );
        for (let match of digitalWrites) {
          const pin = parseInt(match[1]);
          const state = match[2].toUpperCase() === "HIGH" ? 1 : 0;
          arduinoPins[pin] = state;
          circuitComponents.forEach((comp) => {
            if (
              comp.compDef.model === "led" &&
              comp.pins.some((p) => p.name === "+")
            )
              comp.values.state = state === 1;
            if (
              comp.compDef.model === "buzzer" &&
              comp.pins.some((p) => p.name === "+")
            )
              comp.values.state = state === 1;
            if (
              comp.compDef.model === "relay" &&
              comp.pins.some((p) => p.name === "IN")
            )
              comp.values.active = state === 1;
          });
        }
        // servo.write
        const servoWrites = code.matchAll(/(\w+)\.write\((\d+)\)/gi);
        for (let match of servoWrites) {
          const angle = parseInt(match[2]);
          circuitComponents.forEach((comp) => {
            if (comp.compDef.model === "servo") comp.values.angle = angle;
          });
        }
        // lcd.print
        const lcdPrints = code.matchAll(/lcd\.print\(["'](.+?)["']\)/gi);
        for (let match of lcdPrints) {
          const text = match[1];
          circuitComponents.forEach((comp) => {
            if (comp.compDef.model === "lcd") comp.values.text = text;
          });
        }
        // Serial.print / Serial.println (دعم Unicode)
        const serialPrintAll = code.matchAll(
          /Serial\.(print|println)\((["'])(.*?)\2\)/gi,
        );
        for (let match of serialPrintAll) {
          const cmd = match[1];
          let content = match[3];
          if (cmd === "println") addSerialLine(content, true);
          else addSerialLine(content, false);
        }
        // Serial.println بدون وسائط
        const emptyPrintln = /Serial\.println\s*\(\s*\)/gi;
        if (emptyPrintln.test(code)) addSerialLine("", true);
        drawCanvas();
      }

      function addSerialLine(msg, newLine = true) {
        const out = document.getElementById("serialOutput");
        const div = document.createElement("div");
        div.className = "serial-line";
        div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
        out.appendChild(div);
        out.scrollTop = out.scrollHeight;
      }

      let simulationTimer = null;
      function runSimulation() {
        if (simulationTimer) clearInterval(simulationTimer);
        isSimulating = true;
        parseAndRunCode();
        simulationTimer = setInterval(() => {
          parseAndRunCode();
          analyzeCircuit();
        }, 300);
        addSerialLine("🚀 بدء المحاكاة", true);
      }
      function stopSimulation() {
        if (simulationTimer) clearInterval(simulationTimer);
        isSimulating = false;
        addSerialLine("⏹️ إيقاف المحاكاة", true);
      }
      function sendSerialCmd() {
        const input = document.getElementById("serialInput");
        const val = input.value;
        addSerialLine("> " + val, true);
        input.value = "";
        if (val === "status") addSerialLine("النظام يعمل، 4 مواقف متاحة", true);
        else addSerialLine("أمر غير معروف", true);
      }

      // بناء مكتبة القطع في الواجهة
      function buildComponentLibrary() {
        const container = document.getElementById("compList");
        const cats = [...new Map(COMPONENTS.map((c) => [c.cat, c.cat])).keys()];
        cats.forEach((cat) => {
          const catDiv = document.createElement("div");
          catDiv.className = "comp-cat";
          catDiv.innerText = cat;
          container.appendChild(catDiv);
          COMPONENTS.filter((c) => c.cat === cat).forEach((comp) => {
            const item = document.createElement("div");
            item.className = "comp-item";
            item.draggable = true;
            item.innerHTML = `<div class="comp-icon">${comp.icon}</div><div class="comp-info"><div class="comp-name">${comp.name}</div><div class="comp-desc">${comp.desc}</div></div>`;
            item.addEventListener("dragstart", (e) => {
              e.dataTransfer.setData("compType", comp.id);
              e.dataTransfer.effectAllowed = "copy";
            });
            container.appendChild(item);
          });
        });
      }

      // تهيئة الكانفاس والسحب والإفلات
      function initCanvasAndDrop() {
        canvas = document.getElementById("circuitCanvas");
        const area = document.getElementById("canvasArea");
        canvas.width = area.clientWidth;
        canvas.height = area.clientHeight;
        canvasWidth = canvas.width;
        canvasHeight = canvas.height;
        ctx = canvas.getContext("2d");
        initCanvasEvents();
        canvas.addEventListener("dragover", (e) => e.preventDefault());
        canvas.addEventListener("drop", (e) => {
          e.preventDefault();
          const compType = e.dataTransfer.getData("compType");
          const compDef = COMPONENTS.find((c) => c.id === compType);
          if (compDef) {
            const rect = canvas.getBoundingClientRect();
            let x =
              (e.clientX - rect.left) * (canvas.width / rect.width) -
              compDef.width / 2;
            let y =
              (e.clientY - rect.top) * (canvas.height / rect.height) -
              compDef.height / 2;
            addComponent(compDef, x, y);
          }
        });
        window.addEventListener("resize", () => {
          canvas.width = area.clientWidth;
          canvas.height = area.clientHeight;
          drawCanvas();
        });
        drawCanvas();
      }

      // حفظ وتحميل ومسح
      function saveProject() {
        const data = { components: circuitComponents, wires: wires };
        localStorage.setItem("embedded_project", JSON.stringify(data));
        alert("تم حفظ المشروع");
      }
      function loadProject() {
        const data = localStorage.getItem("embedded_project");
        if (data) {
          const parsed = JSON.parse(data);
          circuitComponents = parsed.components;
          wires = parsed.wires;
          drawCanvas();
          alert("تم تحميل المشروع");
        }
      }
      function clearCanvas() {
        circuitComponents = [];
        wires = [];
        selectedCompId = null;
        wireMode.active = false;
        drawCanvas();
        updatePropsPanel(null);
      }
      function fitView() {}
      function deleteLastWire() {
        if (wires.length > 0) wires.pop();
        drawCanvas();
      }

      // IDE ومحرر
      function initIDE() {
        const editor = document.getElementById("codeEditor");
        editor.value = `#include <ESP32Servo.h>
#include <LiquidCrystal_I2C.h>

Servo myServo;
LiquidCrystal_I2C lcd(0x27, 16, 2);

void setup() {
  Serial.begin(9600);
  while (!Serial);
  Serial.println("Привет, мир!");  // روسي
  Serial.println("Как дела?");
  Serial.println("مرحباً بالعالم"); // عربي
  pinMode(13, OUTPUT);
  myServo.attach(9);
  lcd.init();
  lcd.backlight();
}

void loop() {
  digitalWrite(13, HIGH);
  delay(500);
  digitalWrite(13, LOW);
  delay(500);
  myServo.write(90);
  delay(1000);
  myServo.write(0);
  lcd.setCursor(0,0);
  lcd.print("Hello World");
  delay(2000);
}`;
        updateLineNumbers();
        editor.addEventListener("input", updateLineNumbers);
        document.querySelectorAll(".ide-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            document
              .querySelectorAll(".ide-tab")
              .forEach((t) => t.classList.remove("active"));
            tab.classList.add("active");
            const target = tab.dataset.tab;
            document.getElementById("codePane").style.display =
              target === "code" ? "flex" : "none";
            document.getElementById("serialPane").style.display =
              target === "serial" ? "flex" : "none";
          });
        });
      }
      function updateLineNumbers() {
        const editor = document.getElementById("codeEditor");
        const lines = editor.value.split("\n").length;
        document.getElementById("lineNumbers").innerHTML = Array.from(
          { length: lines },
          (_, i) => i + 1,
        ).join("<br>");
      }

      window.addEventListener("load", () => {
        buildComponentLibrary();
        initCanvasAndDrop();
        initIDE();
        // لا نضيف أي قطع افتراضية
      });
    </script>
  </body>
</html>
