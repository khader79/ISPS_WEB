<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>موقف سمارت | لوحة المستخدم</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f8f5f0;
      --bg-card: rgba(255,255,255,0.72);
      --bg-card-hover: rgba(255,255,255,0.88);
      --border: rgba(0,0,0,0.04);
      --border-active: rgba(13,148,136,0.15);
      --accent: #0d9488;
      --accent2: #0891b2;
      --gold: #d97706;
      --gold-light: #fef3c7;
      --rose: #e11d48;
      --rose-light: #ffe4e6;
      --green: #10b981;
      --green-bg: #d1fae5;
      --red: #dc2626;
      --red-bg: #fee2e2;
      --amber: #d97706;
      --amber-bg: #fef3c7;
      --text: #1c1917;
      --text-soft: #44403c;
      --muted: #a8a29e;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 4px 24px rgba(180,140,100,0.08);
      --shadow-lg: 0 8px 40px rgba(180,140,100,0.1);
      --font: 'Cairo', 'Inter', sans-serif;
    }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 15% 20%, rgba(245,158,11,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 85% 80%, rgba(13,148,136,0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(225,29,72,0.02) 0%, transparent 50%);
      min-height: 100vh;
      padding: 20px;
      font-family: var(--font);
      color: var(--text);
      position: relative;
    }

    /* Subtle geometric pattern overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        repeating-linear-gradient(0deg, transparent, transparent 80px, rgba(13,148,136,0.015) 80px, rgba(13,148,136,0.015) 81px),
        repeating-linear-gradient(90deg, transparent, transparent 80px, rgba(13,148,136,0.015) 80px, rgba(13,148,136,0.015) 81px);
      pointer-events: none;
      z-index: 0;
    }

    /* Decorative blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(245,158,11,0.06), transparent 70%);
      top: -150px; right: -100px;
      animation: blobFloat 30s ease-in-out infinite;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(13,148,136,0.05), transparent 70%);
      bottom: -100px; left: -100px;
      animation: blobFloat 25s ease-in-out infinite reverse;
    }
    .blob-3 {
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(225,29,72,0.03), transparent 70%);
      top: 40%; left: 60%;
      animation: blobFloat 20s ease-in-out infinite 5s;
    }

    @keyframes blobFloat {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 40px) scale(0.95); }
    }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(13,148,136,0.15); border-radius: 10px; }

    .container { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }

    /* Card */
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      box-shadow: var(--shadow);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      animation: fadeUp 0.5s ease both;
    }
    .card:hover {
      background: var(--bg-card-hover);
      border-color: var(--border-active);
      box-shadow: var(--shadow-lg);
    }
    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    /* Header */
    .header {
      background: rgba(255,255,255,0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      box-shadow: var(--shadow);
      animation: fadeUp 0.5s ease;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .logo-icon {
      width: 42px; height: 42px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 16px rgba(13,148,136,0.2);
    }
    .logo h1 { font-size: 20px; font-weight: 800; color: var(--text); }
    .logo h1 span {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: var(--muted);
    }
    .user-badge .avatar {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--gold), var(--rose));
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 700; color: #fff;
      box-shadow: 0 2px 12px rgba(217,119,6,0.2);
    }
    .logout-btn {
      background: var(--red-bg);
      border: 1px solid rgba(220,38,38,0.1);
      color: var(--red);
      padding: 6px 16px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      font-family: inherit;
    }
    .logout-btn:hover { background: #fecaca; transform: translateY(-1px); }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
      animation: fadeUp 0.5s ease 0.1s both;
    }
    .stat {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }
    .stat:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-lg);
      border-color: var(--border-active);
    }
    .stat .num { font-size: 34px; font-weight: 700; line-height: 1.2; letter-spacing: -1px; }
    .stat .num.green { color: var(--green); }
    .stat .num.red { color: var(--red); }
    .stat .num.amber { color: var(--gold); }
    .stat .lbl { font-size: 11px; color: var(--muted); margin-top: 4px; font-weight: 500; }

    /* Grid */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 16px;
      margin-bottom: 20px;
    }
    @media (max-width: 860px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Slots */
    .slots-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    @media (max-width: 600px) { .slots-grid { grid-template-columns: repeat(2, 1fr); } }

    .slot {
      background: rgba(0,0,0,0.01);
      border: 1.5px solid rgba(0,0,0,0.04);
      border-radius: 14px;
      padding: 16px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      min-height: 105px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      position: relative;
      overflow: hidden;
    }
    .slot:hover { transform: translateY(-4px); }

    .slot.free {
      border-color: rgba(16,185,129,0.12);
      background: rgba(16,185,129,0.02);
    }
    .slot.free:hover {
      border-color: var(--green);
      background: rgba(16,185,129,0.04);
      box-shadow: 0 8px 24px rgba(16,185,129,0.08);
    }
    .slot.free .slot-id { color: var(--green); }
    .slot.free .slot-status { color: var(--green); }

    .slot.occ {
      border-color: rgba(220,38,38,0.15);
      background: rgba(220,38,38,0.04);
      cursor: not-allowed;
    }
    .slot.occ:hover {
      border-color: rgba(220,38,38,0.25);
      box-shadow: 0 4px 16px rgba(220,38,38,0.06);
    }
    .slot.occ .slot-id { color: var(--red); }
    .slot.occ .slot-status {
      color: #fff;
      background: var(--red);
      padding: 2px 12px;
      border-radius: 20px;
    }

    .slot.res {
      border-color: rgba(217,119,6,0.08);
      background: rgba(217,119,6,0.02);
      cursor: not-allowed;
    }
    .slot.res .slot-id { color: var(--gold); }
    .slot.res .slot-status { color: var(--gold); }

    .slot.mine {
      border-color: rgba(13,148,136,0.15);
      background: rgba(13,148,136,0.03);
      cursor: default;
    }
    .slot.mine:hover {
      border-color: var(--accent);
      box-shadow: 0 8px 24px rgba(13,148,136,0.08);
    }
    .slot.mine .slot-id { color: var(--accent); }
    .slot.mine .slot-status { color: var(--accent); }

    .slot-id { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .slot-icon { font-size: 24px; line-height: 1; margin: 2px 0; }
    .slot-status {
      font-size: 9px; font-weight: 600;
      padding: 2px 12px; border-radius: 20px;
      background: rgba(0,0,0,0.02);
    }

    /* Cancel btn on slot */
    .slot-cancel-btn {
      position: absolute;
      top: 5px; left: 5px;
      width: 22px; height: 22px;
      border-radius: 50%;
      border: none;
      background: var(--red-bg);
      color: var(--red);
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.25s;
      z-index: 2;
      line-height: 1;
    }
    .slot:hover .slot-cancel-btn { opacity: 1; }
    .slot-cancel-btn:hover { background: #fecaca; transform: scale(1.15); }
    @media (hover: none) { .slot-cancel-btn { opacity: 1; } }

    /* Form */
    .form-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .field { flex: 1; min-width: 120px; }
    .field label {
      display: block; font-size: 11px; color: var(--muted);
      margin-bottom: 4px; font-weight: 600;
    }
    .field select, .field input {
      width: 100%;
      background: rgba(0,0,0,0.02);
      border: 1.5px solid rgba(0,0,0,0.06);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      transition: border-color 0.25s;
    }
    .field select:focus, .field input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13,148,136,0.06);
    }
    .field select option { background: #fff; }

    .btn {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff;
      box-shadow: 0 4px 16px rgba(13,148,136,0.2);
    }
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(13,148,136,0.25);
    }
    .btn-danger {
      background: linear-gradient(135deg, var(--rose), var(--red));
      color: #fff;
      box-shadow: 0 4px 16px rgba(225,29,72,0.15);
    }
    .btn-danger:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(225,29,72,0.2);
    }

    /* Active reservation card */
    .res-card {
      background: linear-gradient(135deg, rgba(16,185,129,0.04), rgba(13,148,136,0.04));
      border: 1px solid rgba(16,185,129,0.1);
      border-radius: 14px;
      padding: 18px;
      text-align: center;
      margin-top: 8px;
      position: relative;
      animation: fadeUp 0.4s ease;
    }
    .res-card .slot-name { font-size: 28px; font-weight: 800; color: var(--accent); }
    .res-card .res-sub { font-size: 11px; color: var(--muted); margin: 2px 0; }
    .res-card .timer {
      font-size: 36px; font-weight: 300;
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
      letter-spacing: 6px;
      transition: color 0.3s;
    }
    .res-card .timer.ok { color: var(--green); }
    .res-card .timer.warn { color: var(--gold); }
    .res-card .timer.critical { color: var(--red); animation: pulse 0.8s ease infinite; }
    .res-card .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    /* Gate OTP */
    .otp-input-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }
    .otp-input-group input {
      flex: 1;
      min-width: 0;
      background: rgba(0,0,0,0.02);
      border: 1.5px solid rgba(0,0,0,0.06);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text);
      font-size: 22px;
      font-family: 'Courier New', monospace;
      letter-spacing: 8px;
      text-align: center;
      direction: ltr;
      transition: border-color 0.25s, box-shadow 0.25s;
    }
    .otp-input-group input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(13,148,136,0.06);
    }
    .otp-input-group input::placeholder { letter-spacing: normal; font-size: 13px; color: var(--muted); }
    @media (max-width: 500px) {
      .otp-input-group { flex-direction: column; }
      .otp-input-group input { width: 100%; letter-spacing: 4px; padding: 14px; }
      .otp-input-group .btn { width: 100%; justify-content: center; }
    }

    .gate-status { font-size: 13px; margin-top: 10px; min-height: 26px; font-weight: 500; }

    /* System status */
    .sys-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    @media (max-width: 500px) { .sys-grid { grid-template-columns: 1fr; } }
    .sys-item {
      background: rgba(0,0,0,0.02);
      border-radius: 12px;
      padding: 14px;
      font-size: 12px;
      text-align: center;
      border: 1px solid rgba(0,0,0,0.03);
    }
    .sys-item .label {
      color: var(--muted);
      display: block;
      margin-bottom: 6px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .sys-item .value {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }
    .dot {
      display: inline-block;
      width: 8px; height: 8px;
      border-radius: 50%;
    }
    .dot-green { background: var(--green); box-shadow: 0 0 10px rgba(16,185,129,0.3); }
    .dot-red { background: var(--red); box-shadow: 0 0 10px rgba(220,38,38,0.3); }
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,0.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.5s linear infinite;
    }

    .hidden { display: none !important; }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(24px);
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 13px;
      font-weight: 600;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      text-align: center;
      max-width: 90vw;
      box-shadow: 0 8px 40px rgba(0,0,0,0.08);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
    .toast.ok { background: rgba(16,185,129,0.12); border: 1px solid rgba(16,185,129,0.2); color: var(--green); }
    .toast.err { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.15); color: var(--red); }
    .toast.info { background: rgba(13,148,136,0.08); border: 1px solid rgba(13,148,136,0.15); color: var(--accent); }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .header { padding: 12px 16px; }
      .stat .num { font-size: 24px; }
      .card { padding: 14px; }
      .res-card .timer { font-size: 28px; letter-spacing: 4px; }
    }
  </style>
</head>
<body>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="logo-icon">🅿️</div>
        <h1>موقف <span>سمارت</span></h1>
      </div>
      <div class="user-badge">
        <div class="avatar" id="userAvatar">U</div>
        <span id="userEmail">جاري التحميل...</span>
        <button class="logout-btn" id="logoutBtn">تسجيل خروج</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat"><div class="num green" id="availableCount">0</div><div class="lbl">مواقف متاحة</div></div>
      <div class="stat"><div class="num red" id="occupiedCount">0</div><div class="lbl">مشغولة</div></div>
      <div class="stat"><div class="num amber" id="activeReservationSpan">—</div><div class="lbl">حجزي النشط</div></div>
    </div>

    <div class="grid-2">
      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-title">🅿️ المواقف — اضغط على موقف متاح للحجز</div>
          <div class="slots-grid" id="slotsGrid"></div>
        </div>

        <div class="card" id="bookingSection">
          <div class="card-title">📅 حجز جديد</div>
          <div class="form-row">
            <div class="field">
              <label>الموقف</label>
              <select id="slotSelect"><option value="">اختر موقف</option></select>
            </div>
            <div class="field">
              <label>المدة (دقائق)</label>
              <input type="number" id="durationMinutes" min="5" max="240" value="30" />
            </div>
            <button class="btn btn-primary" id="createReservationBtn">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              حجز
            </button>
          </div>
        </div>

        <div class="card hidden" id="activeReservationSection">
          <div class="card-title">✅ حجز نشط</div>
          <div class="res-card">
            <div style="font-size:11px;color:var(--muted);font-weight:500">الموقف المحجوز</div>
            <div class="slot-name" id="activeSlotDisplay">—</div>
            <div class="res-sub">رمز الحجز: <span id="activeReservationId">—</span></div>
            <div class="timer ok" id="countdownDisplay"></div>
            <div class="hint">🔑 توجه إلى البوابة واقرأ الكود من شاشة LCD</div>
            <button class="btn btn-danger" id="cancelReservationBtn" style="margin-top:10px">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
              إلغاء الحجز
            </button>
          </div>
        </div>
      </div>

      <div style="display:flex;flex-direction:column;gap:16px">
        <div class="card">
          <div class="card-title">🚪 فتح البوابة</div>
          <div class="otp-input-group">
            <input type="text" id="gateOtpInput" maxlength="6" placeholder="أدخل الكود من شاشة LCD" autocomplete="off" dir="ltr" />
            <button class="btn btn-primary" id="submitOtpBtn">
